services:
  mcp:
    build: ./mcp
    image: ghcr.io/pranjallk1995/luna-vita-mcp:${LUNA_IMAGE_TAG:-v1.4.3}
    working_dir: /workspace/mcp
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:-http://localhost:19090}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      LUNAVITA_API_TOKEN: ${LUNAVITA_API_TOKEN:?Set LUNAVITA_API_TOKEN to a random value of at least 32 characters}
      DATABASE_URL: postgresql://lunavita:${POSTGRES_PASSWORD:-lunavita-dev}@luna-sentia-db:5432/lunavita
      LUNAVISIA_API_URL: ${LUNAVISIA_API_URL:-http://luna-visia-mcp:8000}
      LUNAVISIA_COMPANION_TOKEN: ${LUNAVISIA_COMPANION_TOKEN:-}
      LUNAVITA_PLACEHOLDER_IMAGE_ID: ${LUNAVITA_PLACEHOLDER_IMAGE_ID:-858eafb0-73ad-4717-8095-8cef43c62d3c}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:18001}
      UI_PUBLIC_URL: ${UI_PUBLIC_URL:-http://localhost:18502}
      TZ: Asia/Kolkata
    expose:
      - "8000"
    ports:
      - "127.0.0.1:18001:8000"
    develop:
      watch:
        - action: sync+restart
          path: ./mcp/app
          target: /workspace/mcp/app
        - action: rebuild
          path: ./mcp/requirements.txt
        - action: rebuild
          path: ./mcp/Dockerfile
    networks:
      sentia_network:
        aliases:
          - luna-vita-mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    image: ghcr.io/pranjallk1995/luna-vita-ui:${LUNA_IMAGE_TAG:-v1.4.3}
    working_dir: /workspace/ui
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:-http://localhost:19090}
      LUNAVITA_API_TOKEN: ${LUNAVITA_API_TOKEN:?Set LUNAVITA_API_TOKEN to a random value of at least 32 characters}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      LUNAVITA_API_URL: http://luna-vita-mcp:8000
      LUNAVITA_ALLOWED_EMAILS: ${LUNAVITA_ALLOWED_EMAILS:?Set LUNAVITA_ALLOWED_EMAILS to the Google accounts allowed to access Vita}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:18502:8501"
    develop:
      watch:
        # The gateway restarts on Python changes; the browser app is built into the image.
        - action: sync+restart
          path: ./ui
          target: /workspace/ui
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - .pytest_cache/
            - requirements.txt
            - Dockerfile
            - web/
        - action: rebuild
          path: ./ui/web/src
        - action: rebuild
          path: ./ui/web/package.json
        - action: rebuild
          path: ./ui/requirements.txt
        - action: rebuild
          path: ./ui/Dockerfile
    networks:
      sentia_network:
        aliases:
          - luna-vita-ui
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mcp:
        condition: service_healthy

networks:
  sentia_network:
    external: true
    name: luna_sentia_network
