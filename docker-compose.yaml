services:
  mcp:
    build: ./mcp
    working_dir: /workspace/mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lunavita:${POSTGRES_PASSWORD:-lunavita-dev}@luna-sentia-db:5432/lunavita
      LUNAVISIA_API_URL: ${LUNAVISIA_API_URL:-http://luna-visia-mcp:8000}
      LUNAVITA_PLACEHOLDER_IMAGE_ID: ${LUNAVITA_PLACEHOLDER_IMAGE_ID:-b7adf6ae-30b3-4750-8381-5dc6ab393de6}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:18001}
      TZ: Asia/Kolkata
    expose:
      - "8000"
    ports:
      - "127.0.0.1:18001:8000"
    develop:
      watch:
        - action: sync+restart
          path: ./mcp/app
          target: /workspace/mcp/app
        - action: rebuild
          path: ./mcp/requirements.txt
        - action: rebuild
          path: ./mcp/Dockerfile
    networks:
      sentia_network:
        aliases:
          - luna-vita-mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    working_dir: /workspace/ui
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:?Set LUNA_SSO_URL to Luna Sentia's public sign-on address}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      LUNAVITA_API_URL: http://luna-vita-mcp:8000
      LUNAVITA_ALLOWED_EMAILS: ${LUNAVITA_ALLOWED_EMAILS:?Set LUNAVITA_ALLOWED_EMAILS to the Google accounts allowed to access Vita}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:18502:8501"
    develop:
      watch:
        - action: sync
          path: ./ui
          target: /workspace/ui
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - requirements.txt
            - Dockerfile
        - action: rebuild
          path: ./ui/requirements.txt
        - action: rebuild
          path: ./ui/Dockerfile
    networks:
      sentia_network:
        aliases:
          - luna-vita-ui
    depends_on:
      mcp:
        condition: service_healthy

networks:
  sentia_network:
    external: true
    name: luna_sentia_network
